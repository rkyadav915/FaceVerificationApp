name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
        # Note: full requirements.txt (opencv/dlib/face_recognition) is not installed
        # in CI yet since some are heavy native builds. Add back once the app
        # actually depends on them in code that CI needs to run/import.

      - name: Lint with flake8
        run: |
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src tests --count --exit-zero --max-line-length=120 --statistics

      - name: Run tests
        run: |
          if find tests -name "test_*.py" | grep -q .; then
            pytest tests
          else
            echo "No tests found yet — skipping."
          fi
